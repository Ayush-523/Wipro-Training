<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: auto;
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>User Registration</h2>

    <form action="/save" method="post" th:object="${user}">

        <input type="text" th:field="*{name}" placeholder="Enter Name" required>

        <input type="email" th:field="*{email}" placeholder="Enter Email" required>

        <input type="password" th:field="*{password}" placeholder="Enter Password" required>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
