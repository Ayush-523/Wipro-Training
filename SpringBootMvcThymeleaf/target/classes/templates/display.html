<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Display Users</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        table {
            width: 80%;
            margin: auto;
            margin-top: 50px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>

<h1 style="text-align:center">Registered Users</h1>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Password</th>
    </tr>

    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.password}"></td>
    </tr>

</table>

</body>
</html>
