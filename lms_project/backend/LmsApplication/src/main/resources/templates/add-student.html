<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>

    <style>

        body{
            font-family:Arial;
            background:#f1f5f9;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:8px;
            border:1px solid gray;
        }

        button{
            margin-top:20px;
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
        }

    </style>
</head>
<body>

<div class="container">

    <h2>Add Student</h2>

    <form th:action="@{/admin/students/save}" th:object="${student}" method="post">

        <input type="text" th:field="*{name}" placeholder="Enter Name">
        <span th:errors="*{name}"></span>

        <input type="email" th:field="*{email}" placeholder="Enter Email">
        <span th:errors="*{email}"></span>

        <input type="text" th:field="*{department}" placeholder="Enter Department">

        <button type="submit">Save Student</button>

    </form>

</div>

</body>
</html>
