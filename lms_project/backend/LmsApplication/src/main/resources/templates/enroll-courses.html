<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enroll Courses</title>
    <style>
        body { font-family:Arial; background:#f1f5f9; padding:40px; }
        .container { max-width:600px; margin:0 auto; background:white;
            padding:40px; border-radius:15px; box-shadow:0 2px 15px rgba(0,0,0,0.1); }
        h2 { color:#1f2937; margin-bottom:5px; }
        .student-info { color:#6b7280; margin-bottom:25px; font-size:14px; }
        .course-item { display:flex; align-items:center; gap:12px; padding:12px 16px;
            border:1px solid #e5e7eb; border-radius:8px; margin-bottom:10px; cursor:pointer; }
        .course-item:hover { background:#f0f9ff; border-color:#2563eb; }
        .course-item input { width:18px; height:18px; cursor:pointer; }
        .course-item label { cursor:pointer; flex:1; }
        .course-item .trainer { color:#6b7280; font-size:12px; }
        .enrolled-badge { background:#dcfce7; color:#15803d; padding:2px 8px;
            border-radius:10px; font-size:11px; }
        .btn { width:100%; padding:13px; background:#2563eb; color:white;
            border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:20px; }
        .btn:hover { background:#1d4ed8; }
        .back { display:block; margin-top:15px; color:#2563eb; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Enroll Student in Courses</h2>
    <div class="student-info">
        Student: <strong th:text="${student.name}"></strong> |
        Dept: <span th:text="${student.department}"></span>
    </div>

    <form th:action="@{/admin/students/enroll/{id}(id=${student.id})}" method="post">
        <div th:each="c : ${allCourses}" class="course-item">
            <input type="checkbox" th:id="${'course-' + c.id}" name="courseIds"
                   th:value="${c.id}"
                   th:checked="${student.courses.contains(c)}" />
            <label th:for="${'course-' + c.id}">
                <div th:text="${c.courseName}">Course Name</div>
                <div class="trainer">Trainer: <span th:text="${c.trainer}"></span></div>
            </label>
            <span th:if="${student.courses.contains(c)}" class="enrolled-badge">Enrolled</span>
        </div>

        <div th:if="${#lists.isEmpty(allCourses)}" style="color:#6b7280;text-align:center;padding:20px;">
            No courses available. <a href="/admin/courses/add">Add a course first.</a>
        </div>

        <button type="submit" class="btn">Save Enrollment</button>
    </form>

    <a href="/admin/students/view" class="back">← Back to Students</a>
</div>
</body>
</html>
