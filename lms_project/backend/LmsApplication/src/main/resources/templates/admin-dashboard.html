<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <style>
        body { margin:0; font-family:Arial; background:#f4f6f9; }
        .sidebar { width:250px; height:100vh; background:#1f2937; position:fixed; padding-top:20px; }
        .sidebar h2 { color:white; text-align:center; padding:10px 0; border-bottom:1px solid #374151; }
        .sidebar a { display:block; color:#d1d5db; padding:14px 20px; text-decoration:none; font-size:14px; }
        .sidebar a:hover { background:#374151; color:white; }
        .sidebar .logout { position:absolute; bottom:20px; width:100%; }
        .content { margin-left:250px; padding:30px; }
        .header { background:white; padding:20px 30px; border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:30px; }
        .header h1 { margin:0; color:#1f2937; }
        .header p { margin:5px 0 0; color:#6b7280; }
        .cards { display:flex; gap:20px; flex-wrap:wrap; }
        .card { background:white; padding:25px 30px; border-radius:12px; min-width:200px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08); border-left:5px solid #2563eb; }
        .card h3 { margin:0 0 8px; color:#6b7280; font-size:14px; text-transform:uppercase; }
        .card .num { font-size:36px; font-weight:bold; color:#1f2937; }
        .quick { margin-top:30px; }
        .quick h2 { color:#1f2937; margin-bottom:15px; }
        .quick-links { display:flex; gap:15px; flex-wrap:wrap; }
        .quick-links a { background:#2563eb; color:white; padding:12px 24px;
            border-radius:8px; text-decoration:none; font-size:14px; }
        .quick-links a:hover { background:#1d4ed8; }
    </style>
</head>
<body>
<div class="sidebar">
    <h2> Admin Panel</h2>
    <a href="/admin/dashboard"> Dashboard</a>
    <a href="/admin/students/add"> Add Student</a>
    <a href="/admin/students/view"> View Students</a>
    <a href="/admin/courses/add"> Add Course</a>
    <a href="/admin/users"> Manage Students</a>
    <a href="/admin/courses/view"> View Courses</a>
    <a href="/logout" class="logout"> Logout</a>
</div>
<div class="content">
    <div class="header">
        <h1>Welcome, Admin </h1>
        <p>Manage students, courses and enrollments from here.</p>
    </div>
    <div class="cards">
        <div class="card">
            <h3>Total Students</h3>
            <div class="num" th:text="${totalStudents}">0</div>
        </div>
        <div class="card">
            <h3>Total Courses</h3>
            <div class="num" th:text="${totalCourses}">0</div>
        </div>
    </div>
    <div class="quick">
        <h2>Quick Actions</h2>
        <div class="quick-links">
            <a href="/admin/students/add">Add Student</a>
            <a href="/admin/courses/add">Add Course</a>
            <a href="/admin/students/view">Enroll Students</a>
        </div>
    </div>
</div>
</body>
</html>
