<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <style>
        body { margin:0; font-family:Arial; background:#eef2f7; }
        .navbar { background:#2563eb; padding:16px 30px; color:white;
            display:flex; justify-content:space-between; align-items:center; }
        .navbar h2 { margin:0; }
        .navbar a { color:white; text-decoration:none; background:rgba(255,255,255,0.2);
            padding:8px 16px; border-radius:8px; }
        .container { padding:30px; }
        .welcome { background:white; padding:25px 30px; border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:25px; }
        .welcome h1 { margin:0 0 5px; color:#1f2937; }
        .welcome p { margin:0; color:#6b7280; }
        h2 { color:#1f2937; margin-bottom:15px; }
        .course-grid { display:flex; flex-wrap:wrap; gap:20px; }
        .course-card { background:white; padding:20px 25px; border-radius:12px; width:250px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08); border-top:4px solid #2563eb; }
        .course-card h3 { margin:0 0 8px; color:#1f2937; }
        .course-card p { margin:0; color:#6b7280; font-size:13px; }
        .badge { display:inline-block; background:#dbeafe; color:#1d4ed8;
            padding:3px 10px; border-radius:20px; font-size:12px; margin-top:10px; }
    </style>
</head>
<body>
<div class="navbar">
    <h2> Student Portal</h2>
    <a href="/logout">Logout</a>
</div>
<div class="container">
    <div class="welcome">
        <h1>Welcome to LMS </h1>
        <p>Browse available courses below. Contact your admin to get enrolled.</p>
    </div>
    <h2>Available Courses</h2>
    <div class="course-grid">
        <div th:each="c : ${courses}" class="course-card">
            <h3 th:text="${c.courseName}">Course Name</h3>
            <p>Trainer: <span th:text="${c.trainer}">Trainer</span></p>
            <span class="badge">Available</span>
        </div>
        <div th:if="${#lists.isEmpty(courses)}">
            <p style="color:#6b7280;">No courses available yet.</p>
        </div>
    </div>
</div>
</body>
</html>
