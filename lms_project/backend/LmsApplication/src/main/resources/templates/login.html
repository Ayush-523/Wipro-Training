<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>LMS Login</title>
  <style>
    body { margin:0; font-family:Arial; background:linear-gradient(to right,#141e30,#243b55);
      height:100vh; display:flex; justify-content:center; align-items:center; }
    .login-box { background:white; padding:40px; width:350px; border-radius:15px;
      box-shadow:0 0 20px rgba(0,0,0,0.3); text-align:center; }
    h2 { margin-bottom:10px; color:#243b55; }
    .role-tabs { display:flex; margin-bottom:20px; border-radius:8px; overflow:hidden; border:1px solid #243b55; }
    .role-tabs button { flex:1; padding:10px; border:none; cursor:pointer;
      background:white; color:#243b55; font-weight:bold; }
    .role-tabs button.active { background:#243b55; color:white; }
    input { width:100%; padding:12px; margin-top:10px; border-radius:8px;
      border:1px solid gray; box-sizing:border-box; }
    .login-btn { width:100%; padding:12px; margin-top:20px; background:#243b55;
      color:white; border:none; border-radius:8px; cursor:pointer; font-size:16px; }
    .login-btn:hover { background:#141e30; }
    .msg { padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px; }
    .error { background:#fee2e2; color:#b91c1c; }
    .success { background:#dcfce7; color:#15803d; }
    .setup-link { margin-top:15px; font-size:12px; color:#666; }
    .setup-link a { color:#243b55; font-weight:bold; }
  </style>
</head>
<body>
<div class="login-box">
  <h2> LMS Login</h2>

  <div th:if="${param.error}" class="msg error">Invalid username or password.</div>
  <div th:if="${param.logout}" class="msg success">You have been logged out.</div>
  <div th:if="${param.setupDone}" class="msg success">Admin created! Please login.</div>

  <div class="role-tabs">
    <button class="active" onclick="setRole('ADMIN', this)">Admin</button>
    <button onclick="setRole('USER', this)">Student</button>
  </div>

  <form th:action="@{/login}" method="post">
    <input type="text" name="username" placeholder="Enter Username" required />
    <input type="password" name="password" placeholder="Enter Password" required />
    <button type="submit" class="login-btn">Login</button>
  </form>

  <div class="setup-link">
    First time? <a href="/setup">Setup Admin Account</a>
  </div>
</div>
<script>
  function setRole(role, btn) {
    document.querySelectorAll('.role-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
</script>
</body>
</html>
